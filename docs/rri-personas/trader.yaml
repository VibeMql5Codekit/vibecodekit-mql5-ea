  text: What is your maximum acceptable drawdown percentage per account?
  mode:
  - PERSONAL
  - TEAM
  - ENTERPRISE
- id: 2
  text: Do you trade multiple pairs simultaneously? If yes, how do you handle correlation
    risk?
  mode:
  - PERSONAL
  - TEAM
  - ENTERPRISE
- id: 3
  text: What is your target profit factor (PF) and Sharpe ratio for a live EA?
  mode:
  - PERSONAL
  - TEAM
  - ENTERPRISE
- id: 4
  text: Do you use both netting and hedging accounts? Which brokers?
  mode:
  - TEAM
  - ENTERPRISE
- id: 5
  text: How long should walk-forward OOS validation run before you trust an EA?
  mode:
  - PERSONAL
  - TEAM
  - ENTERPRISE
